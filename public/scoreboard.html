<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videotron Scoreboard</title>
  <link rel="stylesheet" href="css/scoreboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <div class="stadium-bg"></div>

  <button class="btn-swap" onclick="toggleSwap()" title="Swap Side">
    <i class="fa fa-retweet me-1"></i> SWAP
  </button>

  <div class="status-badge" id="sync-indicator" style="position: fixed; top: 1vh; left: 1vw; font-size: 1.5vh; opacity: 0.3;">
    <i class="fa fa-sync fa-spin"></i>
  </div>

  <div class="scoreboard-container">
    
    <!-- HEADER CABOR & FASE -->
    <header class="scoreboard-header">
      <div id="sb-cabor" class="sb-badge">CABOR</div>
      <div id="sb-tournament" class="sb-tournament-name">NAMA TURNAMEN</div>
      <div id="sb-fase" class="sb-badge-phase">FASE PERTANDINGAN</div>
    </header>

    <!-- PAPAN SKOR UTAMA -->
    <main class="sb-board" id="main-board-container">
      
      <!-- TIM A -->
      <div class="sb-team team-left">
        <h2 class="sb-team-name" id="sb-team-a">TEAM A</h2>
        
        <!-- Team Foul A -->
        <div class="foul-box" id="foul-box-a" style="display: none;">
            <span class="foul-label">FOULS</span>
            <span class="foul-val" id="sb-foul-a">0</span>
        </div>
      </div>

      <!-- ANGKA SKOR -->
      <div class="sb-score-wrapper" style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
        <div id="sb-period" class="sb-period-display" style="font-size: 2vh; font-weight: 800; color: #ffa502; text-transform: uppercase; letter-spacing: 3px; background: rgba(255, 165, 2, 0.1); border: 1px solid rgba(255, 165, 2, 0.2); padding: 0.3vh 1vw; border-radius: 4px; margin-bottom: 1vh; text-shadow: 0 0 10px rgba(255, 165, 2, 0.3);">BABAK 1</div>
        <div class="sb-score-container">
          <div class="sb-score" id="sb-score-a">0</div>
          <div class="sb-colon">:</div>
          <div class="sb-score" id="sb-score-b">0</div>
        </div>

        <!-- SET SCORES FLOATING -->
        <div class="set-scores-container" id="set-scores-panel" style="display: none; position: absolute; top: -5vh; right: -12vw; flex-direction: column; gap: 0.5vh;">
            <div class="set-box" style="background: rgba(0,0,0,0.7); border: 1px solid #4a5568; padding: 0.4vh 1vh; border-radius: 6px; text-align: center;">
                <div class="set-points" id="set1-val" style="font-size: 2vh; color: #ecc94b; font-weight: 900;">0-0</div>
            </div>
            <div class="set-box" style="background: rgba(0,0,0,0.7); border: 1px solid #4a5568; padding: 0.4vh 1vh; border-radius: 6px; text-align: center;">
                <div class="set-points" id="set2-val" style="font-size: 2vh; color: #ecc94b; font-weight: 900;">0-0</div>
            </div>
            <div class="set-box" style="background: rgba(0,0,0,0.7); border: 1px solid #4a5568; padding: 0.4vh 1vh; border-radius: 6px; text-align: center;">
                <div class="set-points" id="set3-val" style="font-size: 2vh; color: #ecc94b; font-weight: 900;">0-0</div>
            </div>
        </div>
      </div>

      <!-- TIM B -->
      <div class="sb-team team-right">
        <h2 class="sb-team-name" id="sb-team-b">TEAM B</h2>

        <!-- Team Foul B -->
        <div class="foul-box" id="foul-box-b" style="display: none;">
            <span class="foul-label">FOULS</span>
            <span class="foul-val" id="sb-foul-b">0</span>
        </div>
      </div>

    </main>

    <!-- WAKTU / TIMER -->
    <footer class="sb-footer">
      <div class="sb-timer" id="sb-timer">00:00</div>
    </footer>

    <!-- BANNER OVERLAY NOTIFIKASI EVENT (GOL/KARTU) -->
    <div id="event-overlay" class="event-overlay">
      <div class="event-banner" id="event-banner">
        <div class="event-title" id="overlay-title">GOAL!!!</div>
        <div class="event-player" id="overlay-player">Nama Pemain (Nomor)</div>
        <div class="event-team" id="overlay-team">Team Name</div>
      </div>
    </div>

    <!-- TIMEOUT OVERLAY -->
    <div id="timeout-overlay" class="event-overlay" style="background: rgba(5, 6, 11, 0.98);">
      <div class="event-banner" style="transform: scale(1); opacity: 1;">
        <div id="sb-timeout-countdown" style="font-size: 35vh; font-family: 'Orbitron', sans-serif; font-weight: 900; color: #ffa502; line-height: 1; text-shadow: 0 0 50px rgba(255, 165, 2, 0.3);">00:00</div>
        <div class="event-title" style="font-size: 10vh; color: #fff; margin-bottom: 2vh; animation: none;">TIMEOUT</div>
        <div id="sb-timeout-team" class="event-team" style="font-size: 6vh; color: #00d2ff;">TIM A</div>
      </div>
    </div>

  </div>

  <script src="js/scoreboard.js"></script>
</body>
</html>
